<svg fill="none" viewBox="0 0 800 100" width="800" height="100" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes binary {
          0% { content: "01001000 01100001 01110010 01110011 01101000"; }
          33% { content: "01001011 01110101 01101101 01100001 01110010"; }
          66% { content: "01010011 01100101 01100011 01110101 01110010 01101001 01110100 01111001"; }
          100% { content: "01001000 01100001 01110010 01110011 01101000"; }
        }
        
        .container {
          width: 100%;
          height: 100px;
          background-color: #000;
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
          position: relative;
        }
        
        .binary-stream {
          color: #0f0;
          font-family: 'Courier New', monospace;
          font-size: 14px;
          text-align: center;
          position: relative;
        }
        
        .binary-stream::after {
          content: "01001000 01100001 01110010 01110011 01101000";
          animation: binary 8s infinite;
        }
        
        @media (prefers-reduced-motion) {
          .binary-stream::after {
            animation: none;
            content: "01001000 01100001 01110010 01110011 01101000";
          }
        }
      </style>
      
      <div class="container">
        <div class="binary-stream"></div>
      </div>
    </div>
  </foreignObject>
</svg>
